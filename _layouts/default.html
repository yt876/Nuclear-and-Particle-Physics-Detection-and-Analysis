<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <title>{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/course-logo.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=4">
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-logo-link" href="{{ '/' | relative_url }}" aria-label="课程主页">
          <img class="site-logo" src="{{ '/assets/images/course-logo.svg' | relative_url }}" alt="核物理标志">
        </a>
        <div class="site-title">
          <a class="site-name" href="{{ '/' | relative_url }}">核与粒子物理实验探测与分析</a>
          <span class="site-name-en">Detection and Analysis in Nuclear and Particle Physics Experiments</span>
        </div>
        <img class="site-partner" src="{{ '/assets/images/buaa-logo.png' | relative_url }}" alt="北京航空航天大学">
      </div>
    </header>

    <nav class="site-nav" aria-label="课程导航">
      <div class="site-nav__inner">
        <a{% if page.url == '/' %} class="current"{% endif %} href="{{ '/' | relative_url }}">课程主页</a>
        <a{% if page.url contains 'Syllabus' %} class="current"{% endif %} href="{{ '/Syllabus.html' | relative_url }}">课程安排</a>
        <a{% if page.url contains 'coursework' %} class="current"{% endif %} href="{{ '/coursework.html' | relative_url }}">课程作业</a>
        <a{% if page.url contains 'experiment' %} class="current"{% endif %} href="{{ '/experiment.html' | relative_url }}">课程实验</a>
        <a{% if page.url contains 'programming' %} class="current"{% endif %} href="{{ '/programming.html' | relative_url }}">编程与 ROOT</a>
        <a{% if page.url contains 'montecarlo' %} class="current"{% endif %} href="{{ '/montecarlo.html' | relative_url }}">蒙卡模拟</a>
        <a{% if page.url contains 'reference' %} class="current"{% endif %} href="{{ '/reference.html' | relative_url }}">学习资料</a>
        <a{% if page.url contains 'knowledge' %} class="current"{% endif %} href="{{ '/knowledge.html' | relative_url }}">知识库</a>
        <a{% if page.url contains 'discussion' %} class="current"{% endif %} href="{{ '/discussion.html' | relative_url }}">讨论留言</a>
      </div>
    </nav>

    <div class="page-shell">
      <main class="course-content">
        {{ content }}
      </main>

    </div>

    <footer class="site-footer">
      <div>核与粒子物理实验探测与分析 · Detection and Analysis in Nuclear and Particle Physics Experiments</div>
    </footer>
  </body>
</html>
